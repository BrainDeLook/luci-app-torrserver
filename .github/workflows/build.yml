name: Build and verify OpenWrt APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '_incoming/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax
        run: |
          node --check luci/view/torrserver/overview.js
          node tests/check-source.cjs
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n packages/torrserver/files/torrserver.init
          sh -n luci/rpcd/luci.torrserver
          sh -n tests/router-smoke.sh
          sh -n tests/container-init.sh
          git diff --check
      - name: Install build tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential flex bison gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file binutils zstd
          msgfmt --check luci/i18n/ru.po -o /dev/null
      - uses: actions/checkout@v4
        with:
          repository: YouROK/TorrServer
          ref: a86d8fa7fd4e07605f240fe69bf299392f7cb023
          path: .build/upstream
      - uses: actions/setup-go@v5
        with:
          go-version-file: .build/upstream/server/go.mod
          cache-dependency-path: .build/upstream/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - uses: actions/cache/restore@v4
        id: upstream-cache
        with:
          path: |
            .build/torrserver
            .build/BUILDINFO.txt
            .build/TORRSERVER-LICENSE.txt
          key: torrserver-arm64-147-${{ hashFiles('scripts/build-upstream.sh') }}
      - name: Build official upstream source
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-upstream.sh .build/upstream .build
      - uses: actions/cache/save@v4
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .build/torrserver
            .build/BUILDINFO.txt
            .build/TORRSERVER-LICENSE.txt
          key: torrserver-arm64-147-${{ hashFiles('scripts/build-upstream.sh') }}
      - name: Download pinned OpenWrt 25.12.5 SDK
        run: |
          curl -fL --retry 3 https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst -o .build/sdk.tar.zst
          echo '1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b  .build/sdk.tar.zst' | sha256sum -c
          mkdir sdk
          tar --zstd -xf .build/sdk.tar.zst --strip-components=1 -C sdk
      - name: Build native APKv3 packages
        run: bash scripts/build-packages.sh sdk .build/torrserver
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Verify installation and service in OpenWrt ARM64
        run: |
          curl -fL --retry 3 https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-25.12.5-armsr-armv8-rootfs.tar.gz -o .build/rootfs.tar.gz
          echo '493336e176fdc1d6a377763e87a58c5854c24f51e83e586b209783e4bb648d42  .build/rootfs.tar.gz' | sha256sum -c
          docker import --platform linux/arm64 .build/rootfs.tar.gz torrserver-test
          docker run -d --name torrserver-test --platform linux/arm64 --privileged -v "$PWD/dist:/packages:ro" -v "$PWD/tests:/tests:ro" torrserver-test /bin/sh /tests/container-init.sh
          for attempt in $(seq 1 30); do
            if docker exec torrserver-test ubus call system board; then break; fi
            sleep 2
          done
          docker exec torrserver-test /bin/sh /tests/router-smoke.sh | tee dist/SMOKE-TEST.txt
          grep -q '^PASS:' dist/SMOKE-TEST.txt
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs torrserver-test || true
          docker exec torrserver-test logread || true
      - uses: actions/upload-artifact@v4
        with:
          name: torrserver-147-r1-openwrt-25.12.5-aarch64_generic
          path: dist/
          if-no-files-found: error
